<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
      body {
        background-color: #f8f9fa;
        padding-top: 50px;
      }
      .main-card {
        border: 1px solid #dee2e6;
        border-radius: 8px;
      }
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
    </style>
  </head>

  <body ng-app="myApp" ng-controller="myCtrl">
    <div class="container">
      <!-- Loader -->
      <div class="loader-overlay" ng-if="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <span class="ms-2">Processing...</span>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-10">
          <div class="card main-card p-4 mb-4">
            <h2 class="mb-4 text-center">
              {{isEditing ? 'Update User' : 'Add New User'}}
            </h2>

            <div class="alert alert-danger" ng-if="errorMessage">
              {{errorMessage}}
            </div>

            <form
              name="userForm"
              ng-submit="saveUser()"
              class="row g-3"
              novalidate
            >
              <div class="col-md-5">
                <input
                  name="email"
                  type="email"
                  class="form-control"
                  placeholder="Email Address"
                  ng-model="newUser.email"
                  required
                  ng-class="{'is-invalid': userForm.email.$touched && userForm.email.$invalid}"
                />
              </div>
              <div class="col-md-4">
                <input
                  name="name"
                  type="text"
                  class="form-control"
                  placeholder="Full Name"
                  ng-model="newUser.name"
                  required
                  ng-minlength="3"
                  ng-class="{'is-invalid': userForm.name.$touched && userForm.name.$invalid}"
                />
              </div>
              <div class="col-md-3 d-flex gap-2">
                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  ng-disabled="userForm.$invalid"
                >
                  {{isEditing ? 'Update' : 'Add'}}
                </button>
                <button
                  type="button"
                  class="btn btn-secondary"
                  ng-if="isEditing"
                  ng-click="resetForm()"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>

          <div class="card main-card p-0 overflow-hidden">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th class="px-4">ID</th>
                  <th>User Info</th>
                  <th>Created At</th>
                  <th class="text-end px-4">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr ng-repeat="item in users">
                  <td class="px-4 text-muted small">#{{item.id}}</td>
                  <td>
                    <strong>{{item.name}}</strong><br />
                    <small class="text-muted">{{item.email}}</small>
                  </td>
                  <td>{{item.created_at | date:'MMM d, yyyy'}}</td>
                  <td class="text-end px-4">
                    <button
                      class="btn btn-sm btn-outline-primary me-1"
                      ng-click="editUser(item)"
                      title="Edit"
                    >
                      <i class="fas fa-edit"></i>
                    </button>
                    <button
                      class="btn btn-sm btn-outline-danger"
                      ng-click="deleteUser(item.id)"
                      title="Delete"
                    >
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div
              ng-if="users.length === 0 && !loading"
              class="text-center p-5 text-muted"
            >
              No users found.
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var app = angular.module("myApp", []);

      app.service("UserService", function ($http) {
        const api = "https://spnuxpfrtluagbirquiv.supabase.co/rest/v1/users";
        const headers = {
          Authorization:
            "Bearer sb_publishable_iBx7OvsnV3GiQw4FKLhWKA_p4QpRnKo",
          apikey: "sb_publishable_iBx7OvsnV3GiQw4FKLhWKA_p4QpRnKo",
          "Content-Type": "application/json",
          Prefer: "return=minimal",
        };

        this.getUsers = function () {
          return $http.get(api + "?select=*", { headers: headers });
        };

        this.createUser = function (user) {
          return $http.post(api, user, { headers: headers });
        };

        this.updateUser = function (id, user) {
          return $http.patch(api + "?id=eq." + id, user, { headers: headers });
        };

        this.deleteUser = function (id) {
          return $http.delete(api + "?id=eq." + id, { headers: headers });
        };
      });

      app.controller("myCtrl", function ($scope, UserService) {
        $scope.users = [];
        $scope.newUser = {};
        $scope.isEditing = false;
        $scope.loading = false;
        $scope.errorMessage = "";

        $scope.getUsers = function () {
          $scope.loading = true;
          $scope.errorMessage = "";
          UserService.getUsers()
            .then(function (res) {
              $scope.users = res.data;
            })
            .catch(function (err) {
              $scope.errorMessage = "Failed to load users.";
              console.error(err);
            })
            .finally(function () {
              $scope.loading = false;
            });
        };

        $scope.saveUser = function () {
          $scope.loading = true;
          $scope.errorMessage = "";

          if ($scope.isEditing) {
            UserService.updateUser($scope.newUser.id, {
              name: $scope.newUser.name,
              email: $scope.newUser.email,
            })
              .then(function () {
                $scope.resetForm();
                $scope.getUsers();
              })
              .catch(function (err) {
                $scope.errorMessage = "Failed to update user.";
                console.error(err);
              })
              .finally(function () {
                $scope.loading = false;
              });
          } else {
            UserService.createUser($scope.newUser)
              .then(function () {
                $scope.resetForm();
                $scope.getUsers();
              })
              .catch(function (err) {
                $scope.errorMessage = "Failed to add user.";
                console.error(err);
              })
              .finally(function () {
                $scope.loading = false;
              });
          }
        };

        $scope.editUser = function (user) {
          $scope.isEditing = true;
          $scope.newUser = angular.copy(user);
        };

        $scope.deleteUser = function (id) {
          if (confirm("Are you sure you want to delete this user?")) {
            $scope.loading = true;
            UserService.deleteUser(id)
              .then(function () {
                $scope.getUsers();
              })
              .catch(function (err) {
                $scope.errorMessage = "Failed to delete user.";
                console.error(err);
              })
              .finally(function () {
                $scope.loading = false;
              });
          }
        };

        $scope.resetForm = function () {
          $scope.newUser = {};
          $scope.isEditing = false;
          $scope.userForm.$setPristine();
          $scope.userForm.$setUntouched();
        };

        $scope.getUsers();
      });
    </script>
  </body>
</html>
