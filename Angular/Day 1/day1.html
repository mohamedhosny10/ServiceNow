<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .mybox {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    .error-msg {
      color: red;
      font-size: 13px;
      margin-top: 4px;
    }

    .welcome {
      color: green;
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
    }

    .special {
      color: blue;
      text-align: center;
      margin-top: 8px;
    }

  </style>

</head>
<body>

<div ng-app="myApp" ng-controller="myCtrl">
  <div class="mybox">

    <h3>Login</h3>

    <form name="loginForm" novalidate>

      <div class="mb-3">
        <label>Username</label>
        <input type="text"
               class="form-control"
               name="username"
               ng-model="username"
               placeholder="Enter username"
               required>
        <div class="error-msg" ng-show="loginForm.username.$invalid && submitted">
          please enter your username
        </div>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password"
               class="form-control"
               name="password"
               ng-model="password"
               placeholder="Enter password"
               required>
        <div class="error-msg" ng-show="loginForm.password.$invalid && submitted">
          please enter your password
        </div>
      </div>

      <div class="mb-3">
        <input type="checkbox" ng-model="showMsg">
        show special message
      </div>

      <button class="btn btn-primary w-100" ng-click="clickMe()">
        Click Me
      </button>

    </form>

    <div class="welcome" ng-show="studentName">
      Welcome, {{ studentName }} !
    </div>

    <div class="special" ng-hide="!studentName || !showMsg">
      you have a special message, keep it up !
    </div>

  </div>
</div>

<script>

  var app = angular.module('myApp', []);

  app.controller('myCtrl', function($scope) {

    $scope.username    = "";
    $scope.password    = "";
    $scope.studentName = "";
    $scope.showMsg     = false;
    $scope.submitted   = false;

    $scope.clickMe = function() {
      $scope.submitted = true;
      if ($scope.username !== "" && $scope.password !== "") {
        $scope.studentName = $scope.username;
        alert("Welcome " + $scope.studentName);
      }
    };

  });

</script>

</body>
</html>
