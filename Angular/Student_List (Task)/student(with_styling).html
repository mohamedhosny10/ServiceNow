<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <style>
      body { background-color: #f8f9fa; padding-top: 50px; }
      .student-card { max-width: 500px; margin: auto; border-radius: 12px; }
      .list-group-item { display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
      .list-group-item:hover { background-color: #f1f3f5; }
    </style>
  </head>
  <body ng-app="myStudent" ng-controller="studentCtrl">

    <div class="container">
      <div class="card shadow-sm student-card">
        <div class="card-body p-3">
          <h4 class="card-title mb-4 text-center fw-bold text-secondary">Student Directory</h4>
          
          <div class="input-group mb-3">
            <input
              ng-model="studentName"
              type="text"
              class="form-control"
              placeholder="Enter Student Name"
              
            />
            <button class="btn btn-primary px-4" ng-click="addStudent()" ng-disabled="!studentName">
              Add
            </button>
          </div>

          <div ng-if="students.length === 0" class="text-center py-4">
            <p class="text-muted mb-0">No students registered yet</p>
          </div>

          <ul class="list-group list-group">
            <li ng-repeat="student in students track by $index" class="list-group-item border-0 px-md-2 py-2">
              <span class="fw-medium text-dark">{{student}}</span>
              <button class="btn btn-danger btn-sm border-0 p-2" ng-click="deleteStudent($index)">
                Remove
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      var app = angular.module("myStudent", []);
      app.controller("studentCtrl", function ($scope) {
        $scope.students = [];
        $scope.addStudent = function () {
          if ($scope.studentName) {
            $scope.students.push($scope.studentName);
            $scope.studentName = "";
          }
        };
        $scope.deleteStudent = function (index) {
          $scope.students.splice(index, 1);
        };
      });
    </script>
  </body>
</html>
