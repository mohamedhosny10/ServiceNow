<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <input type="text" id="in" required />
      <button type="submit" onclick="displayWeather()">Show</button>
      <p id="result"></p>
      <script>
        let degree = document.getElementById("in");
        function getWeather(x) {
          return new Promise((resolve, reject) => {
            document.getElementById("result").textContent = "Loading....";
            setTimeout(() => {
              if (x == "Paris" || x == "paris") {
                resolve("weather is fine");
              } else {
                reject("city not found");
              }
            }, 2000);
          });
        }
        async function displayWeather() {
          try {
            const data = await getWeather(degree.value);
            document.getElementById("result").textContent = data;
          } catch (error) {
            document.getElementById("result").textContent = error;
          }
        }
      </script>
    </main>
  </body>
</html>
