<body>
    <script>
        function secretKeeper(firstMessage) {
        let secret = firstMessage;
        return {
          readMessage: function () {
            return secret;
          },
          updateMessage: function (newMessage) {
            secret=newMessage;
          },
        };
      }
      const mySecret=secretKeeper("secret awy");
      console.log(mySecret.readMessage());
      mySecret.updateMessage("changed secret");
      console.log(mySecret.readMessage())
    </script>
    
</body>
